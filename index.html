<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bandas de Rock</title>
  <link rel="stylesheet" href="rock.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  <nav>
    <span>Bandas de rock</span>
    <ul>
      <li><a href="index.html" class="activo">Inicio</a></li>
      <li><a href="bandas.html">Más bandas</a></li>
      <li><a href="papu.html">Más rock</a></li>
      <li><a href="heavymetal.html">Heavy metal</a></li>
    </ul>
  </nav>

  <div id="carouselExampleCaptions" class="w-75 mx-auto carousel slide">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="img/The_Beatles_(band).jpg" class="d-block w-100" alt="The Beatles">
        <div class="carousel-caption d-none d-md-block">
          <h5>The Beatles</h5>
          <p>La banda que revolucionó el rock</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="img/nwnw.jpeg" class="d-block w-100" alt="AC/DC">
        <div class="carousel-caption d-none d-md-block">
          <h5>AC/DC</h5>
          <p>Una de las mejores bandas de rock de la historia</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="img/hjhj.jpeg" class="d-block w-100" alt="V8">
        <div class="carousel-caption d-none d-md-block">
          <h5>V8</h5>
          <p>La primera banda metalera de Argentina</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <a href="bandas.html" class="myButton">Rock clásico</a>

  <footer>Rock & Metal – Homenaje a Pappo</footer>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
</body>
</html>
